<script>
/*CORE*/
const TYPES=['3-4','4-5','5-6','6-7','7-8','8-9'];
const DEFAULT_DBIS=[14,16,18,21],DEFAULT_CONNS=[1,2];
const WELD_SHEET_GHZ=['5-6','6-7','7-8','8-9'];
const WELD_SEED_PARTNERS=[{id:'roman',name:'Роман'},{id:'dmytro',name:'Дмитро'}];
const WELD_SEED_ROWS=[
 {partnerId:'roman',code:'6-7-14',received:60,returned:60},
 {partnerId:'roman',code:'6-7-18',received:20,returned:0},
 {partnerId:'dmytro',code:'6-7-14',received:16,returned:0},
 {partnerId:'dmytro',code:'6-7-18',received:5,returned:0},
 {partnerId:'dmytro',code:'7-8-14',received:4,returned:0},
 {partnerId:'dmytro',code:'7-8-18',received:19,returned:13},
 {partnerId:'dmytro',code:'8-9-18',received:18,returned:0}
];
const coll=new Intl.Collator('ru',{numeric:true,sensitivity:'base'});
function seed(){const stock={},thr={};const tv={'3-4':[40,20,20],'4-5':[30,15,3],'5-6':[6,10,10],'6-7':[24,12,12],'7-8':[0,4,4],'8-9':[18,9,9]};
TYPES.forEach(t=>{DEFAULT_DBIS.forEach(dbi=>{stock[t+'|'+dbi+'|horn']=dbi===14?tv[t][0]:0;thr[t+'|'+dbi+'|horn']=10;
 stock[t+'|'+dbi+'|blank']=0;thr[t+'|'+dbi+'|blank']=0});
 DEFAULT_CONNS.forEach(c=>{stock[t+'|'+c+'|cup']=c===1?tv[t][1]:0;thr[t+'|'+c+'|cup']=5})});
Object.assign(stock,{m24:250,cma:12,cma12:0,cma15:0,cma20:0,cap:TYPES.reduce((s,t)=>s+tv[t][2],0)+30,primer:3000,paint:800});
Object.assign(thr,{m24:80,cma:10,cma12:5,cma15:5,cma20:5,cap:10,primer:1000,paint:1000});
return{schema:7,weldingSeeded:true,expected:{},types:TYPES.map(t=>({id:t,name:t+' ГГц',dbis:[...DEFAULT_DBIS],conns:[...DEFAULT_CONNS],parts:[]})),
 shared:[{id:'m24',name:'Винт М24',unit:'шт',qty:8},{id:'cma',name:'CMA разъём',unit:'шт',qty:0},{id:'cma12',name:'CMA разъём 12',unit:'шт',qty:0},{id:'cma15',name:'CMA разъём 15',unit:'шт',qty:0},{id:'cma20',name:'CMA разъём 20',unit:'шт',qty:0},{id:'cap',name:'Заглушка',unit:'шт',qty:1},{id:'primer',name:'Грунт',unit:'мл',qty:50},{id:'paint',name:'Краска',unit:'мл',qty:50}],
 vbom:{horn:{name:'Рупор',unit:'шт',qty:1},cup:{name:'Стакан',unit:'шт',qty:1},blank:{name:'Заготовка рупора',unit:'шт',qty:2}},thr,stock,orders:[],log:[],users:[]}}
function migrate(d){if(!d.types){const b=d.bom||{};d.types=TYPES.map(t=>({id:t,name:t+' ГГц',parts:[{id:'horn',name:'Рупор',unit:'шт',qty:b.horn??1},{id:'cup',name:'Стакан',unit:'шт',qty:b.cup??1},{id:'cap',name:'Заглушка',unit:'шт',qty:b.cap??1}]}));
 d.shared=[{id:'m24',name:'Винт М24',unit:'шт',qty:b.m24??8},{id:'cma',name:'CMA разъём',unit:'шт',qty:b.cma??1},{id:'primer',name:'Грунт',unit:'мл',qty:b.primer??50},{id:'paint',name:'Краска',unit:'мл',qty:b.paint??50}];delete d.bom}
d.users=(d.users||[]).map(u=>({login:u.login||u.name,name:u.name||u.login,pw:u.pw,admin:!!u.admin,disabled:!!u.disabled}));d.stock=d.stock||{};d.thr=d.thr||{};d.orders=d.orders||[];d.log=d.log||[];d.shared=d.shared||[];return d}
function needsMig(d){if(!d||!d.types||!d.types.length)return false;if(!d.schema||d.schema<7)return true;const cma=(d.shared||[]).find(p=>p.id==='cma');if(cma&&+cma.qty!==0)return true;if(!['cma12','cma15','cma20'].every(id=>(d.shared||[]).some(p=>p.id===id)))return true;if(!d.vbom||!d.vbom.horn||d.vbom.horn.qty!==1||!d.vbom.blank)return true;
 if(d.shared.some(p=>p.id==='bush'))return true;if(!d.shared.some(p=>p.id==='cap'))return true;
 if(d.types.some(t=>(t.parts||[]).some(p=>p.id==='cap'||p.id==='horn'||p.id==='cup')))return true;
 if(Object.keys(d.stock||{}).some(k=>{const p=k.split('|');return (p.length===4&&p[3]==='cup')||(p.length===2&&p[1]==='cap')}))return true;
 if(d.types.some(t=>!t.dbis||!t.conns||DEFAULT_DBIS.some(x=>!(t.dbis||[]).includes(x))))return true;
 if(d.types.some(t=>(t.dbis||DEFAULT_DBIS).some(dbi=>d.stock[t.id+'|'+dbi+'|blank']==null)))return true;
 if(!d.weldingSeeded)return true;
 return false}
function migrateV2(d){const notes=[];d.vbom=d.vbom||{horn:{name:'Деталь для рупора',unit:'шт',qty:2},cup:{name:'Стакан',unit:'шт',qty:1}};
 d.types.forEach(t=>{if(!Array.isArray(t.dbis)||!t.dbis.length)t.dbis=[14,18];if(!Array.isArray(t.conns)||!t.conns.length)t.conns=[...DEFAULT_CONNS];
  t.dbis=t.dbis.map(Number).filter(x=>x>0).sort((a,b)=>a-b);t.conns=t.conns.map(Number).filter(x=>x>0).sort((a,b)=>a-b);
  const hadHornCup=(t.parts||[]).some(p=>p.id==='horn'||p.id==='cup');
  if(hadHornCup)t.parts=(t.parts||[]).filter(p=>p.id!=='horn'&&p.id!=='cup');
  const firstDbi=t.dbis[0],firstConn=t.conns.includes(1)?1:t.conns[0];
  const oh=t.id+'|horn',oc=t.id+'|cup';
  if(d.stock[oh]!=null){const nk=t.id+'|'+firstDbi+'|horn';d.stock[nk]=(d.stock[nk]||0)+d.stock[oh];const q=d.stock[oh];delete d.stock[oh];
   if(d.thr[oh]!=null){d.thr[nk]=d.thr[oh];delete d.thr[oh]}notes.push(t.name+': «Деталь для рупора» ('+q+') → вариант '+firstDbi+' дБи.')}
  if(d.stock[oc]!=null){const nk=t.id+'|'+firstDbi+'|'+firstConn+'|cup';d.stock[nk]=(d.stock[nk]||0)+d.stock[oc];const q=d.stock[oc];delete d.stock[oc];
   if(d.thr[oc]!=null){d.thr[nk]=d.thr[oc];delete d.thr[oc]}notes.push(t.name+': «Стакан» ('+q+') → '+firstDbi+' дБи / '+firstConn+' разъём.')}
  t.dbis.forEach(dbi=>{const hk=t.id+'|'+dbi+'|horn';if(d.stock[hk]==null)d.stock[hk]=0;if(d.thr[hk]==null)d.thr[hk]=10;
   t.conns.forEach(c=>{const ck=t.id+'|'+dbi+'|'+c+'|cup';if(d.stock[ck]==null)d.stock[ck]=0;if(d.thr[ck]==null)d.thr[ck]=5})});
  (t.parts||[]).forEach(p=>{const k=t.id+'|'+p.id;if(d.stock[k]==null)d.stock[k]=0;if(d.thr[k]==null)d.thr[k]=5})});
 if((d.schema||0)<2){if(!d.shared.some(p=>p.id==='bush')){d.shared.push({id:'bush',name:'Втулка',unit:'шт',qty:1});if(d.stock.bush==null)d.stock.bush=0;if(d.thr.bush==null)d.thr.bush=10}
  d.schema=2}return{notes:[...new Set(notes)]}}
function migrateV3(d){const notes=[];
 if(!d.schema||d.schema<2||d.types.some(t=>(t.parts||[]).some(p=>p.id==='horn'||p.id==='cup')||Object.keys(d.stock).some(k=>k===t.id+'|horn'||k===t.id+'|cup'))){
  const r=migrateV2(d);notes.push(...r.notes)}
 d.vbom=d.vbom||{horn:{name:'Деталь для рупора',unit:'шт',qty:2},cup:{name:'Стакан',unit:'шт',qty:1}};
 const cupMerged={};
 Object.keys(d.stock).filter(k=>{const p=k.split('|');return p.length===4&&p[3]==='cup'}).forEach(k=>{
  const p=k.split('|');const nk=p[0]+'|'+p[2]+'|cup';d.stock[nk]=(d.stock[nk]||0)+(d.stock[k]||0);cupMerged[nk]=(cupMerged[nk]||0)+(d.stock[k]||0);
  if(d.thr[k]!=null&&d.thr[nk]==null)d.thr[nk]=d.thr[k];delete d.stock[k];delete d.thr[k]});
 Object.keys(cupMerged).forEach(nk=>{const p=nk.split('|');notes.push(p[0]+' ГГц: стаканы ('+p[1]+' разъём.) объединены → '+cupMerged[nk]+' шт')});
 let capSum=d.stock.cap||0;const capBits=[];
 if(d.stock.bush!=null){capSum+=d.stock.bush;capBits.push('втулка '+d.stock.bush);delete d.stock.bush;delete d.thr.bush}
 d.types.forEach(t=>{const ck=t.id+'|cap';if(d.stock[ck]!=null){capSum+=d.stock[ck];capBits.push(t.name+' '+d.stock[ck]);delete d.stock[ck];delete d.thr[ck]}
  t.parts=(t.parts||[]).filter(p=>p.id!=='cap')});
 d.shared=(d.shared||[]).filter(p=>p.id!=='bush');
 if(!d.shared.some(p=>p.id==='cap'))d.shared.push({id:'cap',name:'Заглушка',unit:'шт',qty:1});
 else{const c=d.shared.find(p=>p.id==='cap');c.name=c.name||'Заглушка';c.unit=c.unit||'шт';c.qty=1}
 d.stock.cap=capSum;if(d.thr.cap==null)d.thr.cap=10;
 if(capBits.length)notes.push('Заглушка (общая) = сумма: '+capBits.join(' + ')+' → '+capSum+' шт. Втулка удалена (это та же деталь).');
 else notes.push('Заглушка в общих; расход: 1 при 1 разъёме, 0 при 2. Втулка удалена.');
 d.types.forEach(t=>{
  const set=new Set([...(t.dbis||[]).map(Number),...DEFAULT_DBIS]);t.dbis=[...set].filter(x=>x>0).sort((a,b)=>a-b);
  if(!Array.isArray(t.conns)||!t.conns.length)t.conns=[...DEFAULT_CONNS];else t.conns=t.conns.map(Number).filter(x=>x>0).sort((a,b)=>a-b);
  t.dbis.forEach(dbi=>{const hk=t.id+'|'+dbi+'|horn';if(d.stock[hk]==null)d.stock[hk]=0;if(d.thr[hk]==null)d.thr[hk]=10});
  t.conns.forEach(c=>{const ck=t.id+'|'+c+'|cup';if(d.stock[ck]==null)d.stock[ck]=0;if(d.thr[ck]==null)d.thr[ck]=5});
  Object.keys(d.stock).filter(k=>k.startsWith(t.id+'|')&&k.endsWith('|cup')&&k.split('|').length===4).forEach(k=>{delete d.stock[k];delete d.thr[k]})});
 notes.push('дБи: 14/16/18/21 (добавлены недостающие). Стакан общий на ГГц (1 и 2 разъёма). CMA = число разъёмов.');
 d.schema=3;return{notes:[...new Set(notes)]}}
function migrateV4(d){const notes=[];
 if(!d.schema||d.schema<3){const r=migrateV3(d);notes.push(...r.notes)}
 d.vbom=d.vbom||{};
 const oldName=(d.vbom.horn&&d.vbom.horn.name)||'';
 const oldQty=d.vbom.horn?d.vbom.horn.qty:2;
 d.vbom.horn={name:'Рупор',unit:'шт',qty:1};
 d.vbom.cup=d.vbom.cup||{name:'Стакан',unit:'шт',qty:1};
 d.vbom.blank={name:'Заготовка рупора',unit:(d.vbom.blank&&d.vbom.blank.unit)||'шт',qty:2};
 if(oldName&&oldName!=='Рупор')notes.push('Переименовано: «'+oldName+'» → «Рупор».');
 if(oldQty!==1)notes.push('BOM: на антенну нужен 1 рупор (было ×'+(oldQty??2)+'). Остатки рупоров на складе не менялись.');
 let blanks=0;
 d.types.forEach(t=>{(t.dbis||DEFAULT_DBIS).forEach(dbi=>{const bk=t.id+'|'+dbi+'|blank';
  if(d.stock[bk]==null){d.stock[bk]=0;blanks++}if(d.thr[bk]==null)d.thr[bk]=0;
  const hk=t.id+'|'+dbi+'|horn';if(d.stock[hk]==null)d.stock[hk]=0;if(d.thr[hk]==null)d.thr[hk]=10})});
 notes.push('Добавлены «Заготовка рупора» (2 шт = 1 рупор на сварку), остаток 0'+(blanks?'; ключей: '+blanks:'')+'.');
 d.schema=4;return{notes:[...new Set(notes)]}}
function migrateV5(d){const notes=[];
 if(!d.schema||d.schema<4){const r=migrateV4(d);notes.push(...r.notes)}
 const extras=[{id:'cma12',name:'CMA разъём 12'},{id:'cma15',name:'CMA разъём 15'},{id:'cma20',name:'CMA разъём 20'}];
 const added=[];
 extras.forEach(p=>{if(!(d.shared||[]).some(x=>x.id===p.id)){d.shared.push({id:p.id,name:p.name,unit:'шт',qty:0});added.push('«'+p.name+'»')}
  if(d.stock[p.id]==null)d.stock[p.id]=0;if(d.thr[p.id]==null)d.thr[p.id]=5});
 if(added.length)notes.push('Добавлены общие: '+added.join(', ')+' (остаток 0, расход на антенну 0, порог 5). Существующий «CMA разъём» не менялся.');
 else notes.push('CMA разъём 12/15/20 уже на месте (остатки не перезаписывались).');
 d.schema=5;return{notes:[...new Set(notes)]}}
function migrateV6(d){const notes=[];
 if(!d.schema||d.schema<5){const r=migrateV5(d);notes.push(...r.notes)}
 d.expected=d.expected||{};
 d.types.forEach(t=>{(t.dbis||DEFAULT_DBIS).forEach(dbi=>{
  const bk=t.id+'|'+dbi+'|blank';if(d.stock[bk]==null)d.stock[bk]=0;if(d.thr[bk]==null)d.thr[bk]=0;
  const hk=t.id+'|'+dbi+'|horn';if(d.stock[hk]==null)d.stock[hk]=0;if(d.thr[hk]==null)d.thr[hk]=10;
  const ek=expectKey(t.id,dbi);if(d.expected[ek]==null)d.expected[ek]=0})});
 notes.push('Схема 6: заказ списывает только готовый рупор ×1; части (заготовки) хранятся отдельно и не списываются заказом.');
 notes.push('Сварка по типу ГГц+дБи (без разъёмов): отправили N рупоров → −2N частей, на сварке +N; приняли M → со сварки −M, рупоры +M. Неполный возврат оставляется «на сварке».');
 notes.push('В общих комплектующих — сворачиваемый список всех частей рупора и ожидаемых поставок. Остатки склада не затирались.');
 d.schema=6;return{notes:[...new Set(notes)]}}
function migrateV7(d){const notes=[];
 if(!d.schema||d.schema<6){const r=migrateV6(d);notes.push(...r.notes)}
 if(!['cma12','cma15','cma20'].every(id=>(d.shared||[]).some(p=>p.id===id))){const r=migrateV5(d);notes.push(...r.notes)}
 const cma=(d.shared||[]).find(p=>p.id==='cma');
 if(cma){if(+cma.qty!==0)notes.push('«CMA разъём» больше не списывается заказом (норма 0). Остаток на складе не менялся: '+(d.stock&&d.stock.cma!=null?d.stock.cma+' шт':'как был')+'.');
  cma.qty=0;cma.name=cma.name||'CMA разъём'}
 else notes.push('Старый «CMA разъём» в списке не найден — не добавлялся.');
 notes.push('Списание разъёмов: CMA 20 — только 3-4 ГГц; CMA 15 — только 5-6 ГГц; CMA 12 — остальные диапазоны (4-5, 6-7, 7-8, 8-9). Количество = число разъёмов варианта (1 или 2). Старые заказы не пересчитывались.');
 d.schema=7;return{notes:[...new Set(notes)]}}
function runMigrations(d){migrate(d);const notes=[];
 if(!d.schema||d.schema<2){const r=migrateV2(d);notes.push(...r.notes)}
 if(!d.schema||d.schema<3){const r=migrateV3(d);notes.push(...r.notes)}
 if(!d.schema||d.schema<4||!d.vbom||!d.vbom.blank||(d.vbom.horn&&d.vbom.horn.qty!==1)||d.types.some(t=>(t.dbis||[]).some(dbi=>d.stock[t.id+'|'+dbi+'|blank']==null))){
  const r=migrateV4(d);notes.push(...r.notes)}
 if(!d.schema||d.schema<5||!['cma12','cma15','cma20'].every(id=>(d.shared||[]).some(p=>p.id===id))){
  const r=migrateV5(d);notes.push(...r.notes)}
 if(!d.schema||d.schema<6){const r=migrateV6(d);notes.push(...r.notes)}
 if(!d.schema||d.schema<7||((d.shared||[]).some(p=>p.id==='cma'&&+p.qty!==0))){const r=migrateV7(d);notes.push(...r.notes)}
 return{notes:[...new Set(notes)]}}
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function cmaPartFor(typeId,d){const t=((d&&d.types)||(typeof D!=='undefined'&&D&&D.types)||[]).find(x=>x.id===typeId)||{id:typeId,name:String(typeId||'')};

function groupStockLog(log){const items=[],idx=new Map();const re=/^(Заказ|Отмена)\s*#(\d+)/;
 (log||[]).slice(0,400).forEach(l=>{const m=String(l.kind||'').match(re);
  if(m){const key=m[1]+'#'+m[2];if(idx.has(key)){const g=items[idx.get(key)];g.lines.push(l);g.net+=(+l.delta||0)}
   else{idx.set(key,items.length);items.push({type:'group',key,label:m[1]+' #'+m[2],action:m[1],oid:+m[2],ts:l.ts,user:l.user,lines:[l],net:+l.delta||0})}}
  else items.push({type:'row',line:l})});return items}

<div class="line" style="flex-wrap:wrap"><select style="max-width:170px" onchange="weldFilter=this.value;render()"><option value="act" ${weldFilter==='act'?'selected':''}>С наличием / движением</option><option value="rem" ${weldFilter==='rem'?'selected':''}>На сварке</option><option value="parts" ${weldFilter==='parts'?'selected':''}>Есть части</option><option value="all" ${weldFilter==='all'?'selected':''}>Все типы</option></select>
<select style="max-width:160px" onchange="weldGhz=this.value;render()"><option value="all" ${weldGhz==='all'?'selected':''}>Все ГГц</option><option value="sheet" ${weldGhz==='sheet'?'selected':''}>5–9 ГГц</option></select></div>
<div class="pipe" style="margin:10px 0"><div class="step"><span class="small">части, сумма</span><b>${totals.blanks}</b></div><div class="arr">→</div><div class="step"><span class="small">на сварке</span><b class="${totals.welding?'low':''}">${totals.welding}</b></div><div class="arr">→</div><div class="step"><span class="small">рупоры, сумма</span><b>${totals.horns}</b></div></div>
${cards}
<p class="small">По партнёрам: ${pTot.map(t=>esc(t.name)+' — отправили '+t.received+', вернули '+t.returned+', на сварке '+t.rem).join('; ')||'—'}${totals.expected?' · ожидается частей: '+totals.expected:''}.</p></div>
<div class="card"><h2>Журнал сварки</h2><table><tr><th>Когда</th><th>Операция</th><th>Кол-во</th></tr>
${(D.weldingLog||[]).slice(0,40).map(l=>`<tr><td class="small">${fmt(l.ts)}<br>${esc(l.user)}</td><td>${esc(l.kind)} · ${esc(l.partnerName||'')} · ${esc(l.code)}</td><td>${l.qty||''}</td></tr>`).join('')||'<tr><td colspan="3" class="small">Пусто</td></tr>'}</table></div>`}
function openWeldDlg(mode,code){weldDlg={mode,code:code||(weldDlg&&weldDlg.code)||undefined,partnerId:weldDlg&&weldDlg.partnerId,qty:weldDlg&&weldDlg.qty||1};weldScroll=true;render()}
function weldHintText(){if(!weldDlg)return'';
 const partners=activePartners(),map=weldMap();
 const pid=weldDlg.partnerId||(partners[0]&&partners[0]._id)||'';
 const parsed=weldDlg.code&&parseWeldCode(weldDlg.code);
 const rec=weldDlg.code?weldRec(pid,weldDlg.code,map):{received:0,returned:0};const rem=weldRem(rec);
 const blanks=parsed?(D.stock[blankKey(parsed.typeId,parsed.dbi)]||0):0;
 const horns=parsed?(D.stock[hornKey(parsed.typeId,parsed.dbi)]||0):0;
 const n=Math.max(1,Math.floor(+weldDlg.qty||1));
 if(weldDlg.mode==='send')return`Сейчас частей: ${blanks} (хватит на ${Math.floor(blanks/2)} рупоров). У партнёра на сварке: ${rem}. Спишется ${2*n} частей, на сварке станет ${rem+n}. Нельзя отправить больше, чем есть частей.`;
 return`У партнёра на сварке: ${rem}. На складе рупоров: ${horns}. Принять можно не больше остатка; после приёмки ${n} рупоров станет ${horns+n}, на сварке останется ${Math.max(0,rem-n)}.`}
function updWeldHint(){if(!weldDlg)return;weldDlg.qty=$('#wqty')&&$('#wqty').value;const el=$('#whint');if(el)el.textContent=weldHintText()}
function weldDlgHtml(){if(!weldDlg)return'<div id="wdlg"></div>';
 const partners=activePartners();const map=weldMap();
 const all=listWeldCodes(D,weldGhz==='sheet'?WELD_SHEET_GHZ:null);
 const mode=weldDlg.mode;const title=mode==='send'?'Отправить на сварку':'Принять готовые рупоры';
 let pid=weldDlg.partnerId||(partners[0]&&partners[0]._id)||'';
 let codes=all;
 if(mode==='recv'){const withRem=all.filter(c=>weldRem(weldRec(pid,c.code,map))>0);if(withRem.length)codes=withRem}
 let code=weldDlg.code&&codes.some(c=>c.code===weldDlg.code)?weldDlg.code:(codes[0]&&codes[0].code)||'';
 if(weldDlg.code&&!codes.some(c=>c.code===weldDlg.code)&&all.some(c=>c.code===weldDlg.code)&&mode==='send'){code=weldDlg.code;if(!codes.some(c=>c.code===code))codes=[...codes,all.find(c=>c.code===code)]}
 weldDlg.partnerId=pid;weldDlg.code=code;
 const n=Math.max(1,Math.floor(+weldDlg.qty||1));
 return`<div class="card" id="wdlg"><h2>${title}</h2>
<label class="small">Партнёр</label><select id="wpartner" onchange="weldDlg.partnerId=this.value;render()">${partners.map(p=>`<option value="${p._id}" ${p._id===pid?'selected':''}>${esc(p.name)}</option>`).join('')||'<option value="">—</option>'}</select>
<label class="small">Тип (ГГц + дБи)</label><select id="wcode" onchange="weldDlg.code=this.value;render()">${codes.map(c=>`<option value="${c.code}" ${c.code===code?'selected':''}>${esc(c.label||c.code)}</option>`).join('')||'<option value="">—</option>'}</select>
<label class="small">Количество готовых рупоров</label><input id="wqty" type="number" min="1" step="1" value="${n}" oninput="updWeldHint()">
<p class="small" id="whint">${esc(weldHintText())}</p>
<div class="line"><button onclick="weldDlg=null;render()">Отмена</button><button class="p" onclick="doWeld()">${mode==='send'?'Отправить':'Принять'}</button></div></div>`}
async function doWeld(){const pid=$('#wpartner')&&$('#wpartner').value,code=$('#wcode')&&$('#wcode').value,qty=$('#wqty')&&$('#wqty').value;
 try{if(weldDlg.mode==='send'){const r=await FB.weldSend(pid,code,qty);ok('Отправлено на сварку '+r.n+' рупоров · частей −'+r.deducted)}
  else{const r=await FB.weldRecv(pid,code,qty);ok('Принято '+r.m+' рупоров · осталось на сварке '+r.remainder)}
  weldDlg=null}catch(e){bad(FB.err?FB.err(e):e.message||e)}render()}

function backup(){return`<div class="card"><h2>Резервная копия</h2><button class="btn-w" onclick="exp()">⬇ Экспорт JSON</button><label class="small">Импорт JSON:</label><input type="file" accept=".json" onchange="imp(this.files[0])"></div>`}
function exp(){const b=new Blob([JSON.stringify({...D,users:undefined},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sprut-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(f){if(!f)return;f.text().then(async t=>{const n=JSON.parse(t);if(!n.stock)throw 0;if(confirm('Заменить облачные данные этой копией?')){await FB.importLocal(migrate(n));ok('Импортировано');render()}}).catch(()=>{bad('Неверный файл');render()})}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
<script src="export.js" charset="utf-8"></script>
<script type="module" src="db.js"></script></body></html>
