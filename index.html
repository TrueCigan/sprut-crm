<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SprutTactical CRM</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#12161a"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#12161a;--card:#1c2228;--line:#2c353d;--acc:#8fbf3f;--warn:#e0a030;--bad:#e0503c;--tx:#e6e9ec;--mut:#8a96a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:#0d1013;border-bottom:2px solid var(--acc);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header b{letter-spacing:2px;color:var(--acc)}main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:18px;margin:8px 0}h3{font-size:15px;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}.row:last-child{border:0}
.low{color:var(--warn);font-weight:700}.zero{color:var(--bad);font-weight:700}.ok{color:var(--acc)}
button,select,input{font:inherit;min-height:48px;border-radius:10px;border:1px solid var(--line);background:#252d34;color:var(--tx);padding:0 14px}
input,select{width:100%;margin:4px 0 10px}button.p{background:var(--acc);color:#111;font-weight:700;border:0}button.d{background:var(--bad);border:0}
.btn-w{width:100%;margin-top:6px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d1013;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:64px;font-size:13px;color:var(--mut)}nav button.on{color:var(--acc);border-top:3px solid var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.tabs button{flex:0 0 auto}.tabs button.on{background:var(--acc);color:#111}
.small{font-size:13px;color:var(--mut)}.line{display:flex;gap:8px}.line>*{flex:1}.msg{padding:10px;border-radius:8px;margin:8px 0}.msg.w{background:#4a3510}.msg.e{background:#4a1a14}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
</style></head><body><div id="app"></div>
<script>
/*CORE*/
const TYPES=['3-4','4-5','5-6','6-7','7-8','8-9'];
const TPARTS=[{id:'horn',name:'Деталь для рупора',unit:'шт'},{id:'cup',name:'Стакан',unit:'шт'},{id:'cap',name:'Заглушка',unit:'шт'}];
const SPARTS=[{id:'m24',name:'Винт М24',unit:'шт'},{id:'cma',name:'CMA разъём',unit:'шт'},{id:'primer',name:'Грунт',unit:'мл'},{id:'paint',name:'Краска',unit:'мл'}];
// Storage adapter: replace with API calls for a backend later
const Store={key:'sprut_crm_v1',load(){try{return JSON.parse(localStorage.getItem(this.key))}catch(e){return null}},save(d){localStorage.setItem(this.key,JSON.stringify(d))}};
function seed(){const stock={},thr={};const tv={'3-4':[40,20,20],'4-5':[30,15,3],'5-6':[6,10,10],'6-7':[24,12,12],'7-8':[0,4,4],'8-9':[18,9,9]};
TYPES.forEach(t=>TPARTS.forEach((p,i)=>{stock[t+'|'+p.id]=tv[t][i];thr[t+'|'+p.id]=p.id==='horn'?10:5}));
Object.assign(stock,{m24:250,cma:12,primer:3000,paint:800});Object.assign(thr,{m24:80,cma:10,primer:1000,paint:1000});
return{users:[],stock,thr,bom:{horn:2,cup:1,cap:1,m24:8,cma:1,primer:50,paint:50},orders:[],log:[]}}
function partName(k){const[a,b]=k.split('|');if(b){return TPARTS.find(p=>p.id===b).name+' ('+a+' ГГц)'}return SPARTS.find(p=>p.id===a).name}
function partUnit(k){const id=k.includes('|')?k.split('|')[1]:k;return([...TPARTS,...SPARTS].find(p=>p.id===id)).unit}
function requirements(d,lines){const r={};lines.forEach(l=>{const q=+l.qty;if(!(q>0))return;TPARTS.forEach(p=>{const k=l.type+'|'+p.id;r[k]=(r[k]||0)+d.bom[p.id]*q});SPARTS.forEach(p=>{r[p.id]=(r[p.id]||0)+d.bom[p.id]*q})});
return Object.keys(r).map(k=>({key:k,need:r[k],have:d.stock[k]||0,short:Math.max(0,r[k]-(d.stock[k]||0))}))}
function placeOrder(d,lines,user,note){const req=requirements(d,lines);if(!req.length)throw Error('Пустой заказ');if(req.some(x=>x.short>0))throw Error('Недостаточно комплектующих');
const id=(d.orders.length?d.orders[0].id:0)+1,ts=new Date().toISOString();req.forEach(x=>{d.stock[x.key]-=x.need;d.log.unshift({ts,user,key:x.key,delta:-x.need,kind:'Заказ #'+id})});
d.orders.unshift({id,ts,user,note:note||'',lines:lines.filter(l=>+l.qty>0).map(l=>({type:l.type,qty:+l.qty}))});return id}
function adjust(d,key,val,mode,user,note){const old=d.stock[key]||0,nv=mode==='set'?+val:old+(+val);if(isNaN(nv)||nv<0)throw Error('Неверное значение');d.stock[key]=nv;
d.log.unshift({ts:new Date().toISOString(),user,key,delta:nv-old,kind:(mode==='set'?'Корректировка':'Приход')+(note?': '+note:'')})}
function hash(s){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(16)}
/*ENDCORE*/
let D=Store.load()||seed(),U=sessionStorage.getItem('sprut_user'),view='inv',invTab='shared',lines=[{type:'3-4',qty:1}],flash='';
const $=s=>document.querySelector(s),save=()=>Store.save(D),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ts=>new Date(ts).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});
function cls(k){const v=D.stock[k];return v<=0?'zero':v<=D.thr[k]?'low':'ok'}
function render(){const a=$('#app');if(!U){a.innerHTML=authView();return}
const me=D.users.find(u=>u.name===U)||{};a.innerHTML=`<header><b>SPRUT·CRM</b><span class="small">${esc(U)}${me.admin?' (админ)':''} <button onclick="logout()" style="min-height:36px">Выйти</button></span></header><main>${flash}${({inv:invView,order:orderView,hist:histView,set:setView})[view]()}</main>
<nav>${[['inv','📦 Склад'],['order','➕ Заказ'],['hist','📋 История'],['set','⚙️ Настройки']].map(([v,t])=>`<button class="${view===v?'on':''}" onclick="go('${v}')">${t}</button>`).join('')}</nav>`;flash=''}
function authView(){const first=!D.users.length;return`<main><div class="card" style="margin-top:15vh"><h2 style="color:var(--acc)">SPRUT·CRM</h2>${flash}<p class="small">${first?'Первый пользователь станет администратором.':'Вход или регистрация работника'}</p>
<input id="un" placeholder="Имя"><input id="pw" type="password" placeholder="Пароль"><button class="p btn-w" onclick="login()">Войти</button><button class="btn-w" onclick="register()">Зарегистрироваться</button></div></main>`}
function login(){const n=$('#un').value.trim(),u=D.users.find(x=>x.name===n);if(!u||u.pw!==hash($('#pw').value)){flash='<div class="msg e">Неверное имя или пароль</div>';return render()}U=n;sessionStorage.setItem('sprut_user',n);render()}
function register(){const n=$('#un').value.trim(),p=$('#pw').value;if(!n||p.length<3){flash='<div class="msg e">Имя и пароль (мин. 3 символа)</div>';return render()}
if(D.users.find(x=>x.name===n)){flash='<div class="msg e">Пользователь уже есть</div>';return render()}D.users.push({name:n,pw:hash(p),admin:!D.users.length});save();U=n;sessionStorage.setItem('sprut_user',n);render()}
function logout(){U=null;sessionStorage.removeItem('sprut_user');render()}
function go(v){view=v;render();scrollTo(0,0)}
function rowP(k){return`<div class="row"><span>${esc(partName(k).replace(/ \(.*\)/,''))}<br><span class="small">мин. ${D.thr[k]} ${partUnit(k)}</span></span><span class="${cls(k)}" style="font-size:20px">${D.stock[k]} ${partUnit(k)}</span><button onclick="adjDlg('${k}')">±</button></div>`}
function invView(){const lowN=Object.keys(D.stock).filter(k=>cls(k)!=='ok').length;
return`${lowN?`<div class="msg w">⚠️ Мало на складе: ${lowN} позиц.</div>`:''}<div class="tabs">${['shared',...TYPES].map(t=>`<button class="${invTab===t?'on':''}" onclick="invTab='${t}';render()">${t==='shared'?'Общие':t+' ГГц'}${t!=='shared'&&TPARTS.some(p=>cls(t+'|'+p.id)!=='ok')?' ⚠️':''}</button>`).join('')}</div>
<div class="card"><h2>${invTab==='shared'?'Общие комплектующие':'Антенна '+invTab+' ГГц'}</h2>${(invTab==='shared'?SPARTS.map(p=>p.id):TPARTS.map(p=>invTab+'|'+p.id)).map(rowP).join('')}</div><div id="dlg"></div>`}
function adjDlg(k){$('#dlg').innerHTML=`<div class="card"><h2>${esc(partName(k))}</h2><p>Сейчас: <b>${D.stock[k]} ${partUnit(k)}</b></p><select id="am"><option value="add">Приход (+ к остатку)</option><option value="set">Корректировка (точный остаток)</option></select>
<input id="av" type="number" inputmode="decimal" placeholder="Количество, ${partUnit(k)}"><input id="an" placeholder="Комментарий (необяз.)"><div class="line"><button onclick="$('#dlg').innerHTML=''">Отмена</button><button class="p" onclick="doAdj('${k}')">Сохранить</button></div></div>`;$('#dlg').scrollIntoView()}
function doAdj(k){try{adjust(D,k,$('#av').value,$('#am').value,U,$('#an').value.trim());save();flash='<div class="msg" style="background:#24401a">✔ Сохранено</div>'}catch(e){flash=`<div class="msg e">${e.message}</div>`}render()}
function orderView(){const req=requirements(D,lines),sh=req.some(x=>x.short>0);
return`<div class="card"><h2>Новый заказ</h2>${lines.map((l,i)=>`<div class="line"><select onchange="lines[${i}].type=this.value;render()">${TYPES.map(t=>`<option ${t===l.type?'selected':''} value="${t}">${t} ГГц</option>`).join('')}</select>
<input type="number" inputmode="numeric" min="1" value="${l.qty}" onchange="lines[${i}].qty=this.value;render()" style="max-width:90px"><button style="flex:0 0 48px" onclick="lines.splice(${i},1);if(!lines.length)lines.push({type:'3-4',qty:1});render()">✕</button></div>`).join('')}
<button class="btn-w" onclick="lines.push({type:'3-4',qty:1});render()">+ Добавить позицию</button><input id="on" placeholder="Клиент / комментарий"></div>
<div class="card"><h2>Потребуется</h2><table><tr><th>Деталь</th><th>Нужно</th><th>Есть</th></tr>${req.map(x=>`<tr><td>${esc(partName(x.key))}</td><td>${x.need}</td><td class="${x.short?'zero':'ok'}">${x.have}${x.short?' (−'+x.short+')':''}</td></tr>`).join('')}</table>
${sh?'<div class="msg e">⛔ Не хватает комплектующих — заказ нельзя провести. Сделайте приход на складе.</div>':''}<button class="p btn-w" ${sh||!req.length?'disabled style="opacity:.4"':''} onclick="doOrder()">Подтвердить и списать</button></div>`}
function doOrder(){try{const id=placeOrder(D,lines,U,$('#on').value.trim());save();lines=[{type:'3-4',qty:1}];flash=`<div class="msg" style="background:#24401a">✔ Заказ #${id} проведён, комплектующие списаны</div>`;view='hist'}catch(e){flash=`<div class="msg e">${e.message}</div>`}render()}
function histView(){return`<div class="card"><h2>Заказы</h2>${D.orders.map(o=>`<div class="row"><span><b>#${o.id}</b> ${o.lines.map(l=>l.qty+'× '+l.type+' ГГц').join(', ')}<br><span class="small">${fmt(o.ts)} · ${esc(o.user)}${o.note?' · '+esc(o.note):''}</span></span></div>`).join('')||'<p class="small">Заказов пока нет</p>'}</div>
<div class="card"><h2>Движение склада</h2><table>${D.log.slice(0,200).map(l=>`<tr><td class="small">${fmt(l.ts)}<br>${esc(l.user)}</td><td>${esc(partName(l.key))}<br><span class="small">${esc(l.kind)}</span></td><td class="${l.delta<0?'low':'ok'}">${l.delta>0?'+':''}${l.delta}</td></tr>`).join('')||'<tr><td class="small">Пусто</td></tr>'}</table></div>`}
function setView(){const me=D.users.find(u=>u.name===U);if(!me||!me.admin)return'<div class="card"><p>Настройки доступны только администратору.</p></div>'+backup();
const inp=(lbl,path,v)=>`<div class="row"><span>${lbl}</span><input style="max-width:100px;margin:0" type="number" value="${v}" onchange="setNum('${path}',this.value)"></div>`;
return`<div class="card"><h2>Расход на 1 антенну</h2>${[...TPARTS,...SPARTS].map(p=>inp(p.name+', '+p.unit,'bom.'+p.id,D.bom[p.id])).join('')}</div>
<div class="card"><h2>Пороги «мало»</h2>${Object.keys(D.thr).map(k=>inp(esc(partName(k)),'thr.'+k,D.thr[k])).join('')}</div>
<div class="card"><h2>Пользователи</h2>${D.users.map(u=>`<div class="row"><span>${esc(u.name)}${u.admin?' (админ)':''}</span></div>`).join('')}</div>${backup()}`}
function backup(){return`<div class="card"><h2>Резервная копия</h2><button class="btn-w" onclick="exp()">⬇ Экспорт JSON</button><label class="small">Импорт JSON:</label><input type="file" accept=".json" onchange="imp(this.files[0])"></div>`}
function setNum(p,v){const[o,k]=[p.split('.')[0],p.slice(p.indexOf('.')+1)];if(+v>=0){D[o][k]=+v;save()}}
function exp(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sprut-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(f){if(!f)return;f.text().then(t=>{const n=JSON.parse(t);if(!n.stock||!n.bom)throw 0;if(confirm('Заменить все данные копией?')){D=n;save();flash='<div class="msg" style="background:#24401a">✔ Импортировано</div>';render()}}).catch(()=>{flash='<div class="msg e">Неверный файл</div>';render()})}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
